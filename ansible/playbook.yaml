---
- name: Bootstrap Kubernetes Cluster and Argo CD
  hosts: k8s_hosts
  become: true
  tasks:
    - name: Install prerequisite packages
      apt:
        name:
          - curl
          - apt-transport-https
          - git
          - ca-certificates
        state: present
        update_cache: true

    - name: Install K3s Kubernetes Engine
      shell: curl -sfL https://get.k3s.io | INSTALL_K3S_EXEC="--write-kubeconfig-mode 644" sh -
      args:
        creates: /usr/local/bin/k3s

    - name: Wait for K3s kubeconfig to be generated
      wait_for:
        path: /etc/rancher/k3s/k3s.yaml
        state: present
        timeout: 60

    - name: Detect non-root execution user and home directory
      set_fact:
        real_user: "{{ ansible_env.SUDO_USER | default(ansible_user_id) }}"
        real_home: "{{ '/home/' + ansible_env.SUDO_USER if ansible_env.SUDO_USER is defined else ansible_env.HOME }}"

    - name: Ensure target user .kube directory exists
      file:
        path: "{{ real_home }}/.kube"
        state: directory
        owner: "{{ real_user }}"
        group: "{{ real_user }}"
        mode: '0755'

    - name: Force write fresh K3s kubeconfig to user directory
      copy:
        src: /etc/rancher/k3s/k3s.yaml
        dest: "{{ real_home }}/.kube/config"
        remote_src: true
        owner: "{{ real_user }}"
        group: "{{ real_user }}"
        mode: '0600'
        force: true

    - name: Configure system-wide KUBECONFIG profile script
      copy:
        dest: /etc/profile.d/k3s_kubeconfig.sh
        content: |
          export KUBECONFIG="{{ real_home }}/.kube/config"
        mode: '0644'

    - name: Ensure user .bashrc exports current KUBECONFIG
      lineinfile:
        path: "{{ real_home }}/.bashrc"
        regexp: '^export KUBECONFIG='
        line: 'export KUBECONFIG="{{ real_home }}/.kube/config"'
        state: present

    - name: Install Helm 3
      shell: curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      args:
        creates: /usr/local/bin/helm

    - name: Add Argo CD Helm repository
      shell: helm repo add argo https://argoproj.github.io/argo-helm && helm repo update
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml

    - name: Install Argo CD via Helm
      shell: |
        helm upgrade --install argocd argo/argo-cd \
          --namespace argocd \
          --create-namespace \
          --set server.extraArgs="{--insecure}" \
          --wait
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
