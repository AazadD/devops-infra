replicaCount: 1

image:
  repository: devops/app
  tag: latest
  pullPolicy: IfNotPresent

environment: staging

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: traefik
  host: app.local

resources:
  limits:
    cpu: 250m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 64Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 75

pdb:
  enabled: false
  minAvailable: 1
