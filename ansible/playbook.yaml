---
- name: Bootstrap Kubernetes Cluster and Argo CD
  hosts: k8s_hosts
  become: true
  tasks:
    - name: Install prerequisite packages
      apt:
        name:
          - curl
          - apt-transport-https
          - git
          - ca-certificates
        state: present
        update_cache: true

    - name: Install K3s Kubernetes Engine
      shell: curl -sfL https://get.k3s.io | INSTALL_K3S_EXEC="--write-kubeconfig-mode 644" sh -
      args:
        creates: /usr/local/bin/k3s

    - name: Create local user .kube directory
      file:
        path: "{{ lookup('env', 'HOME') }}/.kube"
        state: directory
        owner: "{{ ansible_env.SUDO_USER | default(ansible_user_id) }}"
        group: "{{ ansible_env.SUDO_USER | default(ansible_user_id) }}"
        mode: '0755'

    - name: Copy K3s kubeconfig to user .kube directory
      copy:
        src: /etc/rancher/k3s/k3s.yaml
        dest: "{{ lookup('env', 'HOME') }}/.kube/config"
        remote_src: true
        owner: "{{ ansible_env.SUDO_USER | default(ansible_user_id) }}"
        group: "{{ ansible_env.SUDO_USER | default(ansible_user_id) }}"
        mode: '0600'

    - name: Install Helm 3
      shell: curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      args:
        creates: /usr/local/bin/helm

    - name: Add Argo CD Helm repository
      shell: helm repo add argo https://argoproj.github.io/argo-helm && helm repo update
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml

    - name: Install Argo CD via Helm
      shell: |
        helm upgrade --install argocd argo/argo-cd \
          --namespace argocd \
          --create-namespace \
          --set server.extraArgs="{--insecure}" \
          --wait
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
