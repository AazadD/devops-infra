---
- name: Bootstrap Kubernetes Cluster and Argo CD
  hosts: k8s_hosts
  become: true
  tasks:
    - name: Install prerequisite packages
      apt:
        name:
          - curl
          - apt-transport-https
          - git
          - ca-certificates
        state: present
        update_cache: true

    - name: Install K3s Kubernetes Engine
      shell: curl -sfL https://get.k3s.io | INSTALL_K3S_EXEC="--write-kubeconfig-mode 644" sh -
      args:
        creates: /usr/local/bin/k3s

    - name: Configure local kubeconfig
      shell: |
        mkdir -p $HOME/.kube
        cp /etc/rancher/k3s/k3s.yaml $HOME/.kube/config
        chown $(id -u):$(id -g) $HOME/.kube/config
      become: false

    - name: Install Helm 3
      shell: curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      args:
        creates: /usr/local/bin/helm

    - name: Add Argo CD Helm repository
      shell: helm repo add argo https://argoproj.github.io/argo-helm && helm repo update
      become: false

    - name: Install Argo CD via Helm
      shell: |
        helm upgrade --install argocd argo/argo-cd \
          --namespace argocd \
          --create-namespace \
          --set server.extraArgs="{--insecure}" \
          --wait
      become: false
